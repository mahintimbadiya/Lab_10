<!DOCTYPE html>
<html>
<head>
    <title>Product Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50">

    <!-- Header -->
    <header class="bg-green-900 text-white p-4">
        <h1 class="text-2xl font-bold">MyStore</h1>
    </header>

    <!-- Products -->
    <div class="p-4">
        <h2 class="text-2xl text-center mb-4 text-green-900 font-bold">
            Our Products
        </h2>

        <div class="flex flex-wrap justify-center gap-4">

            <!-- Product 1 -->
            <div class="bg-white p-4 w-60 rounded-lg shadow-md">
                <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=400&h=240&q=80"
                     class="w-full h-36 object-cover rounded"
                     alt="Laptop">
                <h3 class="text-xl font-bold mt-2">Laptop</h3>
                <p class="text-gray-700">Price: ₹45,999</p>
                <button class="bg-green-700 hover:bg-green-900 text-white p-2 mt-2 rounded">
                    Buy Now
                </button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white p-4 w-60 rounded-lg shadow-md">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=400&h=240&q=80"
                     class="w-full h-36 object-cover rounded"
                     alt="Mobile phone">
                <h3 class="text-xl font-bold mt-2">Mobile</h3>
                <p class="text-gray-700">Price: ₹19,999</p>
                <button class="bg-green-700 hover:bg-green-900 text-white p-2 mt-2 rounded">
                    Buy Now
                </button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white p-4 w-60 rounded-lg shadow-md">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=400&h=240&q=80"
                     class="w-full h-36 object-cover rounded"
                     alt="Shoes">
                <h3 class="text-xl font-bold mt-2">Shoes</h3>
                <p class="text-gray-700">Price: ₹2,499</p>
                <button class="bg-green-700 hover:bg-green-900 text-white p-2 mt-2 rounded">
                    Buy Now
                </button>
            </div>

            <!-- Product 4 -->
            <div class="bg-white p-4 w-60 rounded-lg shadow-md">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&h=240&q=80"
                     class="w-full h-36 object-cover rounded"
                     alt="Watch">
                <h3 class="text-xl font-bold mt-2">Watch</h3>
                <p class="text-gray-700">Price: ₹3,499</p>
                <button class="bg-green-700 hover:bg-green-900 text-white p-2 mt-2 rounded">
                    Buy Now
                </button>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-green-950 text-white text-center p-4 mt-4">
        MyStore © 2026
    </footer>

</body>
</html>
